name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ main ]

  workflow_dispatch:

jobs:
  ref:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v3
        with:
          lfs: 'true'
          submodules: 'recursive'

      - uses: conda-incubator/setup-miniconda@v2
        with:
          auto-update-conda: true

      - name: ref-run
        shell: bash -l {0}

        run: |
          cd $GITHUB_WORKSPACE
          git submodule update --init

          conda create --name vatic-env --file vatic/tests/spec-file_linux.txt
          conda activate vatic-env
          pip install .

          sh vatic/tests/check_rts.sh
          echo tests finished successfully!

  lint:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ruff + mypy on the test suite
        run: |
          pip install ruff==0.7.4 mypy==1.13.0 pytest==8.3.3
          ruff check tests
          mypy --ignore-missing-imports --follow-imports=skip \
               --python-version 3.8 tests

  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v3
        with:
          lfs: 'true'
          submodules: 'recursive'

      - uses: conda-incubator/setup-miniconda@v2
        with:
          auto-update-conda: true

      - name: test-run
        shell: bash -l {0}

        run: |
          cd $GITHUB_WORKSPACE
          git submodule update --init

          conda create --name vatic-env -c conda-forge \
                        python=${{ matrix.python-version }} \
                        numpy pandas scipy dill matplotlib pyomo coincbc pytest

          conda activate vatic-env
          pip install .

          vatic-det RTS-GMLC 2020-07-20 2 \
                      --solver cbc --threads 2 --ruc-mipgap=0.01 \
                      --reserve-factor=0.10 --sced-horizon=2 --output-detail 2

          echo tests finished successfully!

      - name: readme-claims
        shell: bash -l {0}

        # run outside the source tree so the *installed* package is tested
        run: |
          conda activate vatic-env
          cd "$RUNNER_TEMP"
          python -m pytest -c "$GITHUB_WORKSPACE/setup.cfg" \
                 "$GITHUB_WORKSPACE/tests" -v

  docker:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: 'true'
          submodules: 'recursive'

      - name: containerized test suite
        run: |
          docker compose -f docker-compose.test.yml build
          docker compose -f docker-compose.test.yml run --rm tests
